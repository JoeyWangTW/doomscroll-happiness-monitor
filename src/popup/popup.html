<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Doomscroll Happiness Monitor</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../../icons/icon32.png" alt="" width="20" height="20">
    <span class="name">Happiness Monitor</span>
    <label class="switch" title="Pause / resume tracking">
      <input type="checkbox" id="enabled"><span class="slider"></span>
    </label>
  </header>

  <section class="card" id="status">
    <div class="row"><span class="dot" id="dot"></span><span id="statusText">Loading…</span></div>
    <div class="mood" id="moodRow" hidden>
      <span class="emoji" id="emoji">😐</span>
      <div>
        <div class="big" id="moodValue">—</div>
        <div class="sub" id="moodSub"></div>
      </div>
    </div>
  </section>

  <section class="card warn" id="cameraCard" hidden>
    <div id="cameraText"></div>
    <button id="cameraBtn" class="primary">Allow camera access</button>
  </section>

  <button id="trackBtn" class="wide" hidden></button>
  <div class="actions">
    <button id="openDash" class="primary">Open dashboard</button>
    <button id="openSettings">Settings</button>
  </div>
  <div class="foot" id="foot"></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
